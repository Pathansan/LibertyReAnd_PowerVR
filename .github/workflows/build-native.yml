name: Build Android Native Renderer (rexgpu-gta4-native)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android-native:
    name: Build librexgpu-gta4-native.so (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools spirv-tools libvulkan-dev libzstd-dev build-essential curl zip unzip
          python3 -m pip install 'cmake>=3.29' ninja

      - name: Initialize required submodules
        run: |
          set -e
          echo "Initializing XenosRecomp and dxc-bin..."
          git submodule update --init --depth 1 tools/XenosRecomp
          (cd tools/XenosRecomp && git submodule update --init --depth 1 thirdparty/dxc-bin)
          
          echo "Initializing RexGlue thirdparty submodules..."
          for sub in cli11 libmspack FFmpeg tomlplusplus simde xxHash spdlog fmt snappy utfcpp imgui sdl3 volk vulkan-headers vulkan-memory-allocator spirv-headers spirv-tools glslang; do
            git submodule update --init --depth 1 "glue/rexglue-sdk-main/thirdparty/$sub"
          done

      - name: Set up Android NDK r29
        run: |
          set -e
          NDK_DIR="$HOME/android-ndk-r29"
          echo "Setting up Android NDK r29..."
          curl -L -o /tmp/ndk-r29.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/ndk-r29.zip -d "$HOME"
          rm -f /tmp/ndk-r29.zip
          mv "$HOME"/android-ndk-r29* "$NDK_DIR" || true
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK installed at: $NDK_DIR"
          ls -d "$NDK_DIR"

      - name: Prepare dependencies and apply patches
        run: |
          python3 tools/setup_repo.py --prepare-only
          find tools -name "dxc-linux" -exec chmod +x {} + || true

      - name: Configure CMake for Android arm64-v8a
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=toolchains/android.cmake \
            -DANDROID_NDK="$ANDROID_NDK" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DLIBERTY_RECOMP_TARGET_PLATFORM=android \
            -DLIBERTY_RECOMP_ANDROID_RUNTIME_ASSETS=ON \
            -DLIBERTY_RECOMP_EMBEDDED_ASSETS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build rexgpu-gta4-native target
        run: |
          cmake --build build --target rexgpu-gta4-native --parallel $(nproc)

      - name: Locate and prepare librexgpu-gta4-native.so
        run: |
          mkdir -p output
          find build -name "librexgpu-gta4-native.so" -exec ls -lh {} +
          find build -name "librexgpu-gta4-native.so" -exec cp -v {} output/ \;

      - name: Upload librexgpu-gta4-native.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: librexgpu-gta4-native-arm64-v8a
          path: output/librexgpu-gta4-native.so
          retention-days: 7
