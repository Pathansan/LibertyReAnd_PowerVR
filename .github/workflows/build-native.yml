name: Build Android Native Renderer (rexgpu-gta4-native)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions: write-all

jobs:
  build-android-native:
    name: Build librexgpu-gta4-native.so (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libvulkan-dev libzstd-dev ninja-build

      - name: Initialize required submodules
        run: |
          set -e
          echo "Initializing XenosRecomp and dxc-bin..."
          git submodule update --init --depth 1 tools/XenosRecomp
          (cd tools/XenosRecomp && git submodule update --init --depth 1 thirdparty/dxc-bin)
          
          echo "Initializing RexGlue thirdparty submodules..."
          for sub in cli11 libmspack FFmpeg tomlplusplus simde xxHash spdlog fmt snappy utfcpp imgui sdl3 volk vulkan-headers vulkan-memory-allocator spirv-headers spirv-tools glslang; do
            git submodule update --init --depth 1 "glue/rexglue-sdk-main/thirdparty/$sub"
          done

      - name: Set up Android NDK r29
        run: |
          set -e
          echo "Setting up Android NDK r29..."
          mkdir -p /tmp/ndk
          curl -L -o /tmp/ndk/ndk-r29.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          sudo unzip -q /tmp/ndk/ndk-r29.zip -d /opt
          rm -rf /tmp/ndk
          NDK_PATH=$(find /opt -maxdepth 2 -name "source.properties" -exec dirname {} \;)
          echo "Discovered NDK at: $NDK_PATH"
          test -f "$NDK_PATH/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Prepare dependencies and apply patches
        run: |
          python3 tools/setup_repo.py --prepare-only
          find tools -name "dxc-linux" -exec chmod +x {} + || true
          mkdir -p tools/local_game_payload

      - name: Configure CMake for Android
        run: |
          echo "Discovered NDK: $ANDROID_NDK"
          ls -la "$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DLIBERTY_RECOMP_TARGET_PLATFORM=android \
            -DLIBERTY_RECOMP_ANDROID_RUNTIME_ASSETS=ON \
            -DLIBERTY_RECOMP_EMBEDDED_ASSETS=ON \
            -DLIBERTY_RECOMP_VULKAN=ON \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee /tmp/cmake_conf.log || {
              echo "=== CMAKE FAILED ==="
              cat /tmp/cmake_conf.log
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B debug-log
              cp /tmp/cmake_conf.log cmake_conf.log
              git add cmake_conf.log
              git commit -m "Debug cmake configure log"
              git push -f origin debug-log
              exit 1
            }

      - name: Build rexgpu-gta4-native target
        run: |
          cmake --build build --target rexgpu-gta4-native --parallel $(nproc) 2>&1 | tee /tmp/cmake_build.log || {
            echo "=== BUILD FAILED ==="
            cat /tmp/cmake_build.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B debug-log
            cp /tmp/cmake_build.log cmake_build.log
            git add cmake_build.log
            git commit -m "Debug cmake build log"
            git push -f origin debug-log
            exit 1
          }

      - name: Locate librexgpu-gta4-native.so
        run: |
          mkdir -p output
          find build -name "librexgpu-gta4-native.so" -exec ls -lh {} +
          find build -name "librexgpu-gta4-native.so" -exec cp -v {} output/ \;

      - name: Push .so to binary-artifacts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout -B binary-artifacts
          mkdir -p dist/arm64-v8a
          cp output/librexgpu-gta4-native.so dist/arm64-v8a/
          git add -f dist/arm64-v8a/librexgpu-gta4-native.so
          git commit -m "Automated build: librexgpu-gta4-native.so (${{ github.sha }})"
          git push -f origin binary-artifacts
